worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;

    # AppFlowy uploads can be large (document attachments, imported
    # Notion archives).  Match the upstream nginx.conf's bumped
    # 256M for /api/workspace/.../publish; the rest of the API is
    # capped at the global 10M default.
    client_max_body_size 256m;

    # Proxy buffers suitable for AppFlowy's mostly-JSON API + the
    # occasional larger publish/import payload.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Timeouts: collaboration endpoints are slow on cold caches;
    # /api/chat (AI streaming) and /api/import (large uploads) need
    # longer.  Defaults are fine for the rest.
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # WebSocket upgrade map.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream appflowy   { server 127.0.0.1:8000; }
    upstream gotrue     { server 127.0.0.1:9999; }
    upstream bridge     { server 127.0.0.1:7000; }
    upstream bouncer    { server 127.0.0.1:7100; }
    upstream minio_api  { server 127.0.0.1:9000; }
    upstream minio_ui   { server 127.0.0.1:9001; }

    # Internal HTTPS listener on :443 — only reachable from inside
    # the container (the OpenHost router never forwards to :443).
    # Used so that GoTrue's server-to-server OIDC calls
    # (which target the public hostname https://appflowy.<zone>/realms/...)
    # can resolve to 127.0.0.1 via /etc/hosts and reach our nginx.
    # The cert is generated by start.sh and trusted via
    # /usr/local/share/ca-certificates so Go's crypto/x509
    # verifier accepts it.
    server {
        listen 127.0.0.1:443 ssl;
        server_name _;
        ssl_certificate     /data/app_data/appflowy/internal-tls/cert.pem;
        ssl_certificate_key /data/app_data/appflowy/internal-tls/key.pem;

        # Pass-through to the bridge for OIDC paths only.  No need
        # to also expose /api, /gotrue, etc. on this listener —
        # nothing internal calls those via the public URL.
        location /realms/openhost/ {
            proxy_pass http://bridge;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            # No X-OpenHost-Is-Owner here: GoTrue's server-to-server
            # token/userinfo calls don't have it, but the bridge
            # only enforces it on /authorize, which the browser
            # always reaches via the public listener.
        }

        location = /_internal_healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Healthcheck — OpenHost's wait_for_ready polls / and rejects
        # 5xx responses; appflowy_cloud's /api/health doesn't need
        # to be reached for a fresh container to be marked running,
        # so we expose a static /_healthz that's always 200.
        location = /_healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # OIDC bridge (flat paths).
        location /_oidc/ {
            proxy_pass http://bridge;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-OpenHost-Is-Owner $http_x_openhost_is_owner;
        }

        # OIDC bridge (Keycloak-shape paths).  GoTrue's
        # external_keycloak fetcher hits these; the bridge serves
        # discovery/jwks/auth/token/userinfo under
        # /realms/openhost/protocol/openid-connect/* exactly like a
        # real Keycloak realm would.
        location /realms/openhost/ {
            proxy_pass http://bridge;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-OpenHost-Is-Owner $http_x_openhost_is_owner;
        }

        # SSO bouncer — owner-gated HTML page that primes the OIDC
        # state and 302s to /authorize.  Same shape as the lemmy
        # implementation.
        location = /sso-bounce {
            proxy_pass http://bouncer;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-OpenHost-Is-Owner $http_x_openhost_is_owner;
        }

        # GoTrue.  Strip the /gotrue/ prefix so GoTrue sees /signup,
        # /token, /verify, /callback at its expected paths.  GoTrue
        # uses the Host header for redirect_to validation, so pass
        # the original Host through.
        location /gotrue/ {
            proxy_pass http://gotrue/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # AppFlowy Cloud API.  The /api/import sub-route is special:
        # it accepts multi-GB uploads with disabled buffering.  The
        # /api/chat sub-route streams AI responses (chunked, no
        # buffering, 600s timeout).  Mirrors the upstream nginx.conf.
        location /api {
            proxy_pass http://appflowy;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;

            location ~* ^/api/workspace/[a-zA-Z0-9_-]+/publish$ {
                proxy_pass http://appflowy;
                proxy_request_buffering off;
                client_max_body_size 256M;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/chat {
                proxy_pass http://appflowy;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                chunked_transfer_encoding on;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;
            }

            location /api/import {
                proxy_pass http://appflowy;
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_cache off;
                client_max_body_size 2G;
            }
        }

        # WebSocket — AppFlowy uses /ws and /ws/v2.  The native
        # apps and AppFlowy-Web both speak v2.  Long-lived
        # connections need a generous read timeout.
        location /ws {
            proxy_pass http://appflowy;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # MinIO API for client-side presigned URL operations.  The
        # presigned URL is signed against the *internal* host
        # (minio:9000), so when nginx proxies back to MinIO it must
        # rewrite the Host header to the same value the URL was
        # signed against.  Mirrors upstream nginx.conf's
        # /minio-api/ block.
        location /minio-api/ {
            proxy_pass http://minio_api/;
            proxy_set_header Host "127.0.0.1:9000";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            client_max_body_size 0;
        }

        # MinIO Web UI (administrative).  The owner-gate is enforced
        # by the OpenHost router on the public path; we pass through
        # to MinIO unauthenticated.
        location /minio/ {
            proxy_pass http://minio_ui/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;
            real_ip_header X-Real-IP;
            proxy_connect_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            chunked_transfer_encoding off;
        }

        # AppFlowy Web static SPA assets — copied from upstream's
        # /usr/share/nginx/html in the Dockerfile.  The SPA does its
        # own client-side routing for /app/<workspace>/<doc>.
        root /opt/appflowy-web/html;
        index index.html;

        location /static/  { try_files $uri =404; }
        location /covers/  { try_files $uri =404; }
        location /af_icons/ { try_files $uri =404; }
        location = /appflowy.ico   { try_files $uri =404; }
        location = /appflowy.svg   { try_files $uri =404; }
        location = /og-image.png   { try_files $uri =404; }
        location = /.well-known/apple-app-site-association  { try_files $uri =404; }
        location = /.well-known/assetlinks.json             { try_files $uri =404; }

        # Owner SSO bounce — when the owner header is set AND there's
        # no GoTrue session cookie AND the request wants HTML, we
        # send them through /sso-bounce first to start the OIDC
        # dance.  Anything matching /api/, /gotrue/, /ws*,
        # /_oidc/, /realms/, static paths is exempted by their own
        # location blocks above.
        #
        # Cookie name: GoTrue's Supabase auth tokens persist as
        # ``sb-<project>-auth-token`` (localStorage) on the SPA, NOT
        # as a cookie — so the no-jwt check is purely heuristic.
        # Until I can find a more reliable signal, we just always
        # bounce owner navigations on /, /app/, /login that want
        # HTML.  The downside is one extra round-trip per
        # cold-load; the upside is no tricky cookie sniffing.
        location = / {
            set $should_bounce "0";
            if ($http_x_openhost_is_owner = "true")  { set $should_bounce "${should_bounce}o"; }
            if ($http_accept ~ "text/html")          { set $should_bounce "${should_bounce}h"; }
            # Don't bounce if the visitor came from /sso-bounce or
            # /gotrue/callback (we'd loop forever).  Approximate via
            # Referer.
            if ($http_referer ~ "/(sso-bounce|gotrue/callback)") { set $should_bounce "${should_bounce}r"; }
            if ($should_bounce = "0oh") {
                rewrite ^/?(.*)$ /sso-bounce?prev=/$1 last;
            }
            try_files $uri /index.html;
        }

        # Fallback: anything we don't have a specific location for
        # (including /app/<id>/<page> SPA routes) gets the SPA
        # index.html.  No SSR; client-side JS reads the URL and
        # renders the right view.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
